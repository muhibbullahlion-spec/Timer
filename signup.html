<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সাইনআপ — HabitTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center px-4 py-8">

  <div class="w-full max-w-md fade-in">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2 mb-6">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-emerald-500 flex items-center justify-center font-bold text-white">H</div>
        <span class="font-bold text-xl">HabitTrack</span>
      </a>
      <h1 class="text-2xl font-bold mb-2">আপনার যাত্রা শুরু হোক</h1>
      <p class="text-slate-400 text-sm">সম্পূর্ণ গোপনীয় · বিচারহীন · আপনার নিয়ন্ত্রণে</p>
    </div>

    <div class="p-6 rounded-2xl bg-slate-900 border border-slate-800">
      
      <div id="errorMsg" class="hidden mb-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm"></div>

      <form id="signupForm" class="space-y-4">
        <div>
          <label class="block text-sm mb-2">নাম (ঐচ্ছিক)</label>
          <input type="text" id="name"
            class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:outline-none transition"
            placeholder="আপনার নাম">
        </div>
        <div>
          <label class="block text-sm mb-2">ইমেইল</label>
          <input type="email" id="email" required
            class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:outline-none transition"
            placeholder="you@example.com">
        </div>
        <div>
          <label class="block text-sm mb-2">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
          <input type="password" id="password" required minlength="6"
            class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:outline-none transition"
            placeholder="••••••••">
        </div>
        <div>
          <label class="block text-sm mb-2">পাসওয়ার্ড নিশ্চিত করুন</label>
          <input type="password" id="confirmPassword" required minlength="6"
            class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:outline-none transition"
            placeholder="••••••••">
        </div>

        <label class="flex items-start gap-3 text-xs text-slate-400 cursor-pointer">
          <input type="checkbox" id="agree" required class="mt-1">
          <span>আমি সম্মত যে আমার সমস্ত ডেটা এনক্রিপ্টেড অবস্থায় সংরক্ষিত থাকবে এবং শুধু আমি দেখতে পাব।</span>
        </label>

        <button type="submit" id="submitBtn"
          class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold transition disabled:opacity-50">
          অ্যাকাউন্ট তৈরি করুন
        </button>
      </form>

      <div class="flex items-center gap-4 my-6">
        <div class="flex-1 h-px bg-slate-800"></div>
        <span class="text-slate-500 text-xs">অথবা</span>
        <div class="flex-1 h-px bg-slate-800"></div>
      </div>

      <button id="googleBtn"
        class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold transition flex items-center justify-center gap-3">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Google দিয়ে সাইনআপ
      </button>

      <p class="text-center text-sm text-slate-400 mt-6">
        অ্যাকাউন্ট আছে? <a href="login.html" class="text-indigo-400 hover:text-indigo-300 font-semibold">লগইন করুন</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { handleSignup, handleGoogle } from './js/auth.js';
    document.getElementById('signupForm').addEventListener('submit', handleSignup);
    document.getElementById('googleBtn').addEventListener('click', handleGoogle);
  </script>
</body>
    </html>
